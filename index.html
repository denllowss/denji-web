<style>
:root{
  color-scheme: light;
  --latar-rgb: 200, 217, 124;
  --profileBackground: #c8d97c;
  --page-bg: var(--profileBackground);
  --bodyText: #2c351e;
  --socialLinkFill: #2c351e;
  --button-style-text: #1e2330;
  --button-style-background: #f1fcbd;
  --button-style-background-hover: #e0eab0;
  --button-style-border-color: #323c1f;
  --button-style-shadow-color: #323c1f;
  --button-style-shadow: 3px 4px 0 var(--button-style-shadow-color);
  --button-style-radius: 28px;
  --link-gap: 12px;
  --link-radius: 26px;
  --container-w: 580px;
  --frame-color: #b0bf6d;
  --pad-x: var(--link-gap);
  --label-size: 14px;
  --card-r: 0px;
  --htl: 0px; --htr: 0px; --hbr: 0px; --hbl: 0px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --ease: cubic-bezier(.2, .8, .3, 1);
  --ease-pop: cubic-bezier(.175, .885, .32, 1.275);
  --ease-out-soft: cubic-bezier(.16, 1, .3, 1);
  --t-fast: 160ms;
  --t-base: 280ms;
  --t-slow: 480ms;
  --anim-speed: 1.25;
}

*, *::before, *::after{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

*{-webkit-tap-highlight-color: transparent}

html, body{
  background-color: var(--page-bg);
  color: var(--bodyText);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

img, svg{
  display: block;
  max-width: 100%;
}

button{
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
}

a{
  color: inherit;
  text-decoration: none;
}

img{
  -webkit-user-drag: none!important;
  user-select: none!important;
  -webkit-user-select: none!important;
  -moz-user-select: none;
  pointer-events: none;
  -webkit-touch-callout: none;
}

.hero, .thumb, .logo-wrap{
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

.sr-only{
  position: absolute!important;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
}

.topbar{
  position: absolute;
  top: calc(12px + var(--safe-top));
  right: calc(14px + var(--safe-right));
  z-index: 30;
}

.icon-btn{
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  cursor: pointer;
  color: #10130a;
  background: rgba(255, 255, 255, .18);
  border: 1px solid rgba(255, 255, 255, .38);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 4px 14px rgba(16, 19, 10, .1);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  backdrop-filter: blur(14px) saturate(160%);
  transition: transform .15s var(--ease), background .2s var(--ease);
  touch-action: manipulation;
}

.icon-btn:hover{
  background: rgba(255, 255, 255, .3);
}

.icon-btn:active{
  transform: scale(.92);
}

.icon-btn svg{
  width: 18px;
  height: 18px;
}

.hero-wrap{
  position: relative;
  width: 100%;
  overflow: hidden;
  background: var(--profileBackground);
}

.hero{
  position: relative;
  width: 100%;
  height: 100%;
  z-index: 0;
  overflow: hidden;
  background: transparent;
  isolation: isolate;
  -webkit-mask-image: linear-gradient(to bottom,
    #000 0%,
    #000 35%,
    rgba(0,0,0,0.99) 48%,
    rgba(0,0,0,0.94) 60%,
    rgba(0,0,0,0.80) 72%,
    rgba(0,0,0,0.56) 83%,
    rgba(0,0,0,0.28) 92%,
    rgba(0,0,0,0.06) 98%,
    transparent 100%);
  mask-image: linear-gradient(to bottom,
    #000 0%,
    #000 35%,
    rgba(0,0,0,0.99) 48%,
    rgba(0,0,0,0.94) 60%,
    rgba(0,0,0,0.80) 72%,
    rgba(0,0,0,0.56) 83%,
    rgba(0,0,0,0.28) 92%,
    rgba(0,0,0,0.06) 98%,
    transparent 100%);
}

.hero img{
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
}

.hero::after{
  content: '';
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: linear-gradient(to bottom,
    rgba(var(--latar-rgb), 0) 0%,
    rgba(var(--latar-rgb), 0) 30%,
    rgba(var(--latar-rgb), 0.015) 42%,
    rgba(var(--latar-rgb), 0.05) 54%,
    rgba(var(--latar-rgb), 0.12) 65%,
    rgba(var(--latar-rgb), 0.24) 75%,
    rgba(var(--latar-rgb), 0.44) 84%,
    rgba(var(--latar-rgb), 0.68) 91.5%,
    rgba(var(--latar-rgb), 0.90) 97%,
    rgba(var(--latar-rgb), 1) 100%);
}

.no-hero .hero-wrap{display: none}

.content{
  position: relative;
  z-index: 3;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: transparent;
}

.logo-wrap{
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 8px 18px rgba(30, 35, 16, .16));
}

.logo{
  width: auto;
  height: auto;
  object-fit: contain;
}

.name-text{
  font-weight: 700;
  letter-spacing: -.02em;
  text-align: center;
  padding-inline: var(--pad-x);
  filter: drop-shadow(0 4px 12px rgba(30, 35, 16, .12));
}

.bio{
  font-weight: 500;
  text-align: center;
  text-wrap: balance;
  white-space: pre-line;
  opacity: .92;
}

.bio:empty{display: none}

.verified{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 2px 6px;
  border-radius: 6px;
  background: transparent;
  color: rgba(0, 0, 0, .75);
  font-size: 11px;
  letter-spacing: -.2px;
}

.verified .vbadge{
  width: 15px;
  height: 15px;
  flex: none;
  display: block;
}

.panel{
  width: 100%;
}

.panel[hidden]{display: none}

.links{
  display: flex;
  flex-direction: column;
}

.link{
  position: relative;
  display: grid;
  background: var(--button-style-background);
  border: 2px solid var(--button-style-border-color);
  border-radius: var(--link-radius);
  box-shadow: var(--button-style-shadow);
  color: var(--button-style-text);
  transition: background .2s var(--ease), transform .12s var(--ease), box-shadow .12s var(--ease);
  touch-action: manipulation;
}

.link:hover{
  background: var(--button-style-background-hover);
}

.link:active{
  transform: translate(2px, 3px);
  box-shadow: 1px 1px 0 var(--button-style-shadow-color);
}

.chin{
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 1px;
  letter-spacing: -.2px;
}

.chin.has-thumb{
  padding-left: 54px;
}

.link-label{
  width: 100%;
  font-size: var(--label-size);
  font-weight: 500;
  line-height: 1.2;
  text-align: center;
  text-wrap: balance;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
}

.link-sub{
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  opacity: .65;
}

.link-sub svg{
  width: 12px;
  height: 12px;
  flex: none;
  fill: currentColor;
}

.thumb{
  position: absolute;
  left: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 38px;
  height: 38px;
  border-radius: 20px;
  overflow: hidden;
  background: rgba(0, 0, 0, .06);
}

.thumb img{
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.socials{
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

.social{
  display: grid;
  place-items: center;
  color: var(--socialLinkFill);
  opacity: .85;
  transition: opacity .18s var(--ease), transform .18s var(--ease);
  touch-action: manipulation;
}

.social:hover{
  opacity: 1;
  transform: translateY(-2px);
}

.social:active{
  transform: scale(.9);
}

.social svg{
  width: 22px;
  height: 22px;
  fill: currentColor;
}

.toast{
  position: fixed;
  left: 50%;
  bottom: calc(20px + var(--safe-bottom));
  z-index: 500;
  transform: translate(-50%, 16px);
  padding: 10px 18px;
  border-radius: 40px;
  background: var(--button-style-text);
  color: var(--button-style-background);
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s var(--ease), transform .25s var(--ease);
}

.toast.show{
  opacity: 1;
  transform: translate(-50%, 0);
}

    min-height: 100dvh;

    padding: 0;
  }

  }

  }

  }
}

  :root{

.anim-on.fx-enter .hero{animation: heroIn calc(var(--t-slow) * 1.1) var(--ease-out-soft) both}
@keyframes heroIn{from{opacity: 0; transform: scale(1.05)} to{opacity: 1; transform: none}}

.anim-on .logo.pop-in,
.anim-on .name-text.pop-in{
  animation: popIn calc(var(--t-base) * 1.15) var(--ease-pop) both;
  animation-delay: .12s;
}
@keyframes popIn{from{opacity: 0; transform: translateY(12px) scale(.95)} to{opacity: 1; transform: none}}

.anim-on.fx-logo .logo,
.anim-on.fx-logo .name-text{
  animation: popIn calc(var(--t-base) * 1.15) var(--ease-pop) both,
            floaty calc(6s * var(--anim-speed)) ease-in-out .8s infinite alternate;
}
@keyframes floaty{
  0%{transform: translateY(0)}
  100%{transform: translateY(-4px)}
}

.anim-on.fx-hero .hero img{
  animation: kenBurns calc(28s * var(--anim-speed)) ease-in-out infinite alternate;
  will-change: transform;

  function linkCard(it){
    if (!it || (!it.judul && !it.url)) return '';
    var url = safeUrl(it.url), label = esc(it.judul || '');
    var thumb = it.gambar ? '<span class="thumb"><img src="' + esc(img(it.gambar)) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" draggable="false"></span>' : '';
    var sub = it.subjudul ? '<span class="link-sub">' + icon(it.ikon) + esc(it.subjudul) + '</span>' : '';
    var cls = 'chin' + (it.gambar ? ' has-thumb' : '');
    var inner = thumb + '<span class="link-label">' + label + '</span>' + sub;
    return '<div class="link"><a class="link-hit" href="' + esc(url) + '" target="_blank" rel="noopener"><div class="' + cls + '">' + inner + '</div></a></div>';
  }

  var panelLinks = '<div class="panel" id="panel-links"><div class="links">' + L.map(linkCard).join('') + '</div></div>';

  var socials = !SO.length ? '' :
    '<nav class="socials" aria-label="Media sosial">' + SO.map(function(s){
      if (!s || !s.url) return '';
      return '<a class="social" href="' + esc(safeUrl(s.url)) + '"' +
        (/^mailto:/i.test(s.url) ? '' : ' target="_blank" rel="noopener"') +
        ' aria-label="' + esc(s.jenis || 'Tautan') + '">' + (icon(s.jenis) || icon('website')) + '</a>';
    }).join('') + '</nav>';

  document.getElementById('app').innerHTML =
    '<div class="frame"><div class="profile' + (pakaiHero ? '' : ' no-hero') + '">' +
      '<div class="topbar"><button class="icon-btn" id="shareBtn" type="button" aria-label="Bagikan halaman ini">' +
        '<svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216,112v96a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V112A16,16,0,0,1,56,96H80a8,8,0,0,1,0,16H56v96H200V112H176a8,8,0,0,1,0-16h24A16,16,0,0,1,216,112ZM93.66,69.66,120,43.31V136a8,8,0,0,0,16,0V43.31l26.34,26.35a8,8,0,0,0,11.32-11.32l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,93.66,69.66Z"/></svg>' +

      '<div class="content" id="content">' +
        '<h1 class="sr-only">' + esc(judul) + '</h1>' + head +
        '<p class="bio">' + esc(P.bio || '') + '</p>' +
        verified + panelLinks + socials +
      '</div>' +
    '</div></div>';

  function toast(msg){
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }

  var sbtn = document.getElementById('shareBtn');
  if (sbtn){
    sbtn.addEventListener('click', function(){
      var data = { title: judul, text: P.bio || judul, url: location.href };
      if (navigator.share){
        navigator.share(data).catch(function(){});
      } else if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(location.href).then(function(){
          toast('Tautan disalin');
        }).catch(function(){
          toast('Gagal menyalin tautan');
        });
      } else {
        toast(location.href);
      }
    });
  }

  var root = document.documentElement;
  var A = ANIMASI || {};
  if (A.aktif !== false){
    root.classList.add('anim-on');
    if (A.masukHalaman !== false) root.classList.add('fx-enter');
    if (A.fotoBernapas !== false) root.classList.add('fx-hero');
    if (A.logoMengambang !== false) root.classList.add('fx-logo');
  }

  var logo = document.querySelector('.logo') || document.querySelector('.name-text');
  if (logo) logo.classList.add('pop-in');

  var fine = window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine) and (min-width:640px)').matches;
