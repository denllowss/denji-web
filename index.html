/* ===== Player: gaya Apple Music web (music.apple.com, light theme) ===== */
/* Nilai diambil dari CSS asli music.apple.com:
   pill .chrome-player (56px, radius 1000px, glass) + .player-lcd + .playback-controls */
.player{
  --amp-primary:rgba(0,0,0,.85);        /* --systemPrimary (light) */
  --amp-secondary:rgba(0,0,0,.56);      /* --systemSecondary (light) */
  --amp-tertiary:rgba(0,0,0,.25);       /* --systemTertiary (light) */
  --amp-track:rgba(0,0,0,.08);          /* systemQuinary-onLight */
  --amp-key:#d60017;                    /* keyColor (light) */
  --amp-key-focus:rgba(214,0,23,.6);
  position:relative;
  width:calc(100% - (var(--pad-x) * 2));
  max-width:668px;                      /* max-width chrome-player asli */
  height:56px;                          /* tinggi chrome-player asli */
  margin:40px var(--pad-x) 0;
  padding:0 16px;
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);place-items:center;
  border:0;border-radius:1000px;background:transparent;
  color:var(--amp-primary);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',Inter,'Helvetica Neue',Arial,sans-serif;
  -webkit-touch-callout:none;touch-action:manipulation;
}
.player::before{                        /* lapisan kaca ::before chrome-player */
  content:'';position:absolute;inset:0;z-index:0;border-radius:inherit;
  background:rgba(245,245,247,.55);     /* glassMaterialBackground-onLight */
  -webkit-backdrop-filter:saturate(220%) blur(16px);
  backdrop-filter:saturate(220%) blur(16px);
  box-shadow:0 10px 40px rgba(0,0,0,.1);
}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .player::before{background:#f2f2f2}
  .vol-pop,.pm{background:#f4f4f4}
}
.player::after{                         /* inner stroke .5-1px khas Apple */
  content:'';position:absolute;inset:0;z-index:0;border-radius:inherit;
  border:1px solid rgba(0,0,0,.05);pointer-events:none;
}
.player:focus-within{outline:none}

/* ---------- LCD: cover + judul/artis + timeline (kolom kiri) ---------- */
.player-lcd{
  position:relative;z-index:1;min-width:0;width:100%;height:56px;
  display:grid;gap:0 8px;align-content:center;
  grid-template-areas:"artwork metadata" "progress progress";
  grid-template-columns:auto minmax(0,1fr);
  grid-template-rows:34px auto;
  padding-top:8px;
}
.player-cover{
  position:relative;grid-area:artwork;width:34px;height:34px;flex:none;
  border-radius:6px;overflow:hidden;background:rgba(0,0,0,.06);
  box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.12);
  cursor:pointer;display:grid;place-items:center;
  -webkit-touch-callout:none;user-select:none;
}
.player-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.player-cover.is-empty svg{width:17px;height:17px;color:var(--amp-tertiary)}
.player-cover .cico{                    /* overlay hover: ikon play/pause asli */
  position:absolute;inset:0;z-index:2;display:grid;place-items:center;color:#fff;
  background:rgba(51,51,51,.3);opacity:0;transition:opacity .15s ease-out;
}
.player-cover:hover .cico,.player-cover:focus-visible .cico{opacity:1}
.player-cover .cico svg{width:12px;height:14px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.player-cover .ic-pause{display:none}
.player.is-on .player-cover .ic-play{display:none}
.player.is-on .player-cover .ic-pause{display:block}
.player-cover:focus-visible{outline:2px solid var(--amp-key-focus);outline-offset:1px}
/* warna ikon meniru amp-icon asli: .icon svg *{fill:currentColor} — menimpa fill bawaan file */
.player svg,.player svg *{fill:currentColor}
.player-meta{grid-area:metadata;min-width:0;display:flex;flex-direction:column;justify-content:center}
.player-name{
  font-size:12px;font-weight:600;line-height:1.25;color:var(--amp-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.player-sub{
  margin-top:1px;font-size:12px;font-weight:400;line-height:1.25;color:var(--amp-secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
/* marquee teks panjang, persis perilaku LCD Apple Music (jeda lalu geser) */
.player-name.is-long,.player-sub.is-long{
  text-overflow:clip;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8px,#000 calc(100% - 8px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 8px,#000 calc(100% - 8px),transparent);
}
.player .mq{display:inline-block;padding-inline-end:40px;animation:ampMq var(--mqd,10s) linear infinite;will-change:transform}
.player-name:hover .mq,.player-sub:hover .mq{animation-play-state:paused}
@keyframes ampMq{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(var(--mq,-50%))}}

/* ---------- timeline tipis di bawah judul (hairline ala web) ---------- */
.player-progress{grid-area:progress;min-width:0;display:grid;grid-template-rows:auto 10px;padding-block:1px}
.player-times{
  grid-row:1;display:flex;justify-content:space-between;
  font-size:11px;line-height:13px;color:var(--amp-secondary);font-variant-numeric:tabular-nums;
  height:0;opacity:0;overflow:hidden;margin-bottom:0;
  transition:opacity .18s ease,height .18s ease,margin .18s ease;
}
.player-progress:hover .player-times,.player-progress:focus-within .player-times{height:13px;opacity:1;margin-bottom:1px}
.player-seek{
  grid-row:2;-webkit-appearance:none;appearance:none;width:100%;height:10px;margin:0;
  background:transparent;cursor:pointer;outline:none;
  --p:0%;--th:2px;
}
.player-seek::-webkit-slider-runnable-track{
  -webkit-appearance:none;height:var(--th);border-radius:99px;overflow:hidden;
  background:linear-gradient(90deg,var(--amp-primary) var(--p),var(--amp-track) var(--p));
}
.player-seek::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;
  border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 4px rgba(0,0,0,.25);
  margin-top:calc((var(--th) - 12px) / 2);
  transform:scale(0);transition:transform .15s ease;
}
.player-seek::-moz-range-track{height:var(--th);border-radius:99px;background:var(--amp-track)}
.player-seek::-moz-range-progress{height:var(--th);border-radius:99px;background:var(--amp-primary)}
.player-seek::-moz-range-thumb{
  width:12px;height:12px;border-radius:50%;background:#fff;
  border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 4px rgba(0,0,0,.25);
  transform:scale(0);transition:transform .15s ease;
}
.player-progress:hover .player-seek,.player-seek:focus-visible,.player-seek:active{--th:7px}
.player-progress:hover .player-seek::-webkit-slider-thumb,
.player-seek:focus-visible::-webkit-slider-thumb,.player-seek:active::-webkit-slider-thumb{transform:scale(1)}
.player-progress:hover .player-seek::-moz-range-thumb,
.player-seek:focus-visible::-moz-range-thumb,.player-seek:active::-moz-range-thumb{transform:scale(1)}
.player-seek:focus-visible{outline:4px solid var(--amp-key-focus);outline-offset:1px;border-radius:99px}

/* ---------- kontrol putar (tengah, ikon asli Apple) ---------- */
.player-controls{position:relative;z-index:1;display:flex;align-items:center;gap:8px;justify-self:center;padding-inline:4px}
.player-controls button{
  display:grid;place-items:center;width:30px;height:30px;border-radius:8px;
  color:var(--amp-primary);cursor:pointer;
  transition:color .15s ease,transform .1s ease;-webkit-tap-highlight-color:transparent;
}
.player-controls .m-play{width:36px;height:34px}
.player-controls button svg{display:block}
/* ukuran persis komponen Apple: skip 28px lebar, play 34px tinggi area */
.player-controls .prev svg,.player-controls .is-off svg{width:27px;height:24px}
.player-controls .m-play svg{width:25px;height:28px}
.player-controls .m-play .ic-pause svg{width:24px;height:28px}
.player-controls .prev{transform:rotate(180deg)}/* persis .button--previous{transform:rotate(180deg)} Apple */
.player-controls button:hover{color:rgba(0,0,0,.62)}
.player-controls button:active{transform:scale(.9)}
.player-controls .prev:active{transform:rotate(180deg) scale(.9)}
.player-controls button.is-off{color:var(--amp-tertiary);cursor:default;pointer-events:none}
.player-controls button:focus-visible{outline:2px solid var(--amp-key-focus);outline-offset:1px}
.player-play .ic-pause{display:none}
.player.is-on .player-play .ic-play{display:none}
.player.is-on .player-play .ic-pause{display:block}

/* ---------- aksi kanan: AirPlay + volume + more (•••) ---------- */
.player-actions{position:relative;z-index:1;display:flex;align-items:center;gap:2px;justify-self:end}
.player-actions .act{
  display:grid;place-items:center;width:28px;height:28px;border-radius:1000px;flex:none;
  color:var(--amp-primary);cursor:pointer;
  transition:background .15s ease,transform .1s ease;-webkit-tap-highlight-color:transparent;
}
.player-actions .act:hover{background:rgba(0,0,0,.06)}
.player-actions .act:active{transform:scale(.9)}
.player-actions .act svg{display:block}
.player-actions .act:focus-visible{outline:2px solid var(--amp-key-focus);outline-offset:1px}
.player audio{position:absolute;width:0;height:0;opacity:0;pointer-events:none}
/* ukuran ikon asli (viewBox sumber) */
#playerAir svg{width:20px;height:16px}
#playerMore svg{width:20px;height:4.6px}
#playerVol svg{width:18px;height:18px}
/* gelombang volume persis ambang amp-chrome-volume (v=0 / <.33 / <.66) */
#playerVol .vw{transition:opacity .1s linear}
#playerVol.lv0 .vw1,#playerVol.lv0 .vw2,#playerVol.lv0 .vw3,
#playerVol.lv1 .vw2,#playerVol.lv1 .vw3,
#playerVol.lv2 .vw3{opacity:0}

/* popover volume kaca (chrome-volume__slider) */
.vol{position:relative;display:flex}
.vol-pop{
  position:absolute;inset-inline-end:-6px;top:50%;translate:0 -50%;z-index:40;
  display:flex;align-items:center;width:112px;height:40px;padding-inline:12px;
  border-radius:1000px;background:rgba(246,246,246,.6);
  -webkit-backdrop-filter:blur(60px) saturate(200%);backdrop-filter:blur(60px) saturate(200%);
  box-shadow:0 10px 30px rgba(0,0,0,.14),inset 0 0 0 .5px rgba(0,0,0,.06);
  opacity:0;pointer-events:none;transform-origin:center right;transform:scaleX(.8);
  transition:opacity .25s ease,transform .25s ease;
}
.vol:hover .vol-pop,.vol:focus-within .vol-pop,.vol.show .vol-pop{opacity:1;pointer-events:auto;transform:scaleX(1)}
.vrange{
  -webkit-appearance:none;appearance:none;width:100%;height:16px;margin:0;
  background:transparent;cursor:pointer;outline:none;--vp:100%;
}
.vrange::-webkit-slider-runnable-track{
  -webkit-appearance:none;height:4px;border-radius:99px;
  background:linear-gradient(90deg,var(--amp-primary) var(--vp),var(--amp-track) var(--vp));
}
.vrange::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;
  border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 4px rgba(0,0,0,.2);margin-top:-4px;
}
.vrange::-moz-range-track{height:4px;border-radius:99px;background:var(--amp-track)}
.vrange::-moz-range-progress{height:4px;border-radius:99px;background:var(--amp-primary)}
.vrange::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.vrange:focus-visible{outline:3px solid var(--amp-key-focus);outline-offset:2px;border-radius:99px}

/* menu "more" kaca */
.pm{
  position:absolute;inset-inline-end:0;bottom:calc(100% + 10px);z-index:40;min-width:196px;
  padding:5px;border-radius:14px;background:rgba(246,246,246,.72);
  -webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  box-shadow:0 10px 34px rgba(0,0,0,.18),inset 0 0 0 .5px rgba(0,0,0,.06);
  opacity:0;pointer-events:none;transform:translateY(6px) scale(.98);transform-origin:bottom right;
  transition:opacity .18s ease,transform .18s ease;
}
.pm.open{opacity:1;pointer-events:auto;transform:none}
.pm a,.pm button.mi{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 12px;border-radius:9px;font-size:13px;line-height:1.2;font-weight:400;
  color:var(--amp-primary);text-align:start;cursor:pointer;white-space:nowrap;
  transition:background .12s ease;
}
.pm a:hover,.pm button.mi:hover{background:rgba(0,0,0,.05)}
.pm a:focus-visible,.pm button.mi:focus-visible{outline:2px solid var(--amp-key-focus);outline-offset:-1px}
.pm .mico{display:grid;place-items:center;flex:none}
.pm .mico svg{width:19px;height:16.6px;display:block}
/* status aktif memakai aksen keyColor Apple (seperti tombol repeat/shuffle yang menyala) */
.pm .is-active .mico{color:var(--amp-key)}
.pm .is-active span:last-child{font-weight:600}

/* layar sangat sempit: sembunyikan AirPlay seperti perilaku web */
@media (max-width:380px){
  .player-actions #playerAir{display:none}
  .player-controls{gap:4px;padding-inline:2px}
}
/* mode hemat animasi / reduced-motion: marquee mati */
.anim-lite .player .mq,.anim-paused .player .mq{animation:none!important;padding-inline-end:0}
.anim-lite .player .mq + .mq,.anim-paused .player .mq + .mq{display:none}
.anim-lite .player-name.is-long,.anim-paused .player-name.is-long,
.anim-lite .player-sub.is-long,.anim-paused .player-sub.is-long{-webkit-mask-image:none;mask-image:none;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){
  .player .mq{animation:none!important;padding-inline-end:0}
  .player .mq + .mq{display:none}
  .player-name.is-long,.player-sub.is-long{-webkit-mask-image:none!important;mask-image:none!important;text-overflow:ellipsis}
  .vol-pop,.pm{transition:none!important}
}
.social{width:32px;height:32px;display:grid;place-items:center;color:var(--socialLinkFill);transition:transform .15s var(--ease);-webkit-tap-highlight-color:transparent}
.social:hover{transform:scale(1.12)}
.social svg{width:32px;height:32px;fill:currentColor}

.toast{
  position:fixed;left:50%;bottom:calc(24px + var(--safe-bottom));z-index:500;transform:translate(-50%,18px);
  padding:11px 20px;border-radius:64px;background:var(--button-style-text);color:var(--button-style-background);
  font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.28);
  opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.oops{
  max-width:520px;margin:60px auto;padding:24px 26px;border-radius:20px;background:#fff;
  border:2px solid #323c1f;box-shadow:3px 4px 0 #323c1f;font-size:15px;line-height:1.6;color:#1e2330;
}
.oops h2{font-size:18px;margin-bottom:10px}
.oops code{background:#f1fcbd;padding:2px 6px;border-radius:6px;font-size:13px}
.oops ul{margin:10px 0 0 18px}

@media (min-width:640px){
  :root{--pad-x:calc(var(--link-gap) * 2);--label-size:16px}
  html{
    background-color:var(--frame-color);
    background-image:
      radial-gradient(ellipse 90% 55% at 50% -12%, color-mix(in srgb, var(--profileBackground) 72%, #fff) 0%, transparent 62%),
      radial-gradient(ellipse 55% 45% at 110% 108%, color-mix(in srgb, var(--frame-color) 45%, #1e2330) 0%, transparent 62%),
      radial-gradient(ellipse 50% 40% at -8% 88%, color-mix(in srgb, var(--button-style-background) 55%, var(--profileBackground)) 0%, transparent 58%),
      linear-gradient(168deg,
        color-mix(in srgb, var(--profileBackground) 82%, #fff) 0%,
        var(--frame-color) 46%,
        color-mix(in srgb, var(--frame-color) 68%, #323c1f) 100%);
    background-attachment:fixed;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(30,35,16,.16) 1.15px, transparent 1.2px);
    background-size:26px 26px;
    opacity:.42;
    -webkit-mask-image:radial-gradient(ellipse 78% 72% at 50% 38%, #000 18%, transparent 100%);
            mask-image:radial-gradient(ellipse 78% 72% at 50% 38%, #000 18%, transparent 100%);
  }
  body::after{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    box-shadow:inset 0 0 140px 48px rgba(30,35,16,.16);
  }
  .frame{
    position:relative;z-index:1;
    padding:48px 24px 72px;
    min-height:100vh;min-height:100dvh;
  }
  .profile{
    border-radius:28px;
    min-height:calc(100dvh - 120px);
    box-shadow:
      0 1px 0 rgba(255,255,255,.38) inset,
      0 28px 56px rgba(30,35,16,.26),
      0 10px 20px rgba(30,35,16,.12);
    border:1px solid rgba(255,255,255,.22);
  }
  .hero-wrap{height:calc(var(--container-w) - 80px)}
  .hero{height:var(--container-w);border-radius:28px 28px 0 0}
  .no-hero .hero-wrap{height:84px}
  .topbar{top:28px;right:28px}
}

@media (min-width:1200px){
  :root{--container-w:620px}
  .frame{padding:64px 32px 88px}
  .profile{
    min-height:calc(100dvh - 152px);
    box-shadow:
      0 1px 0 rgba(255,255,255,.42) inset,
      0 36px 72px rgba(30,35,16,.28),
      0 12px 24px rgba(30,35,16,.12);
  }
}

/* ===== ECHO BLUR BACKGROUND (hanya desktop) =====
   Menampilkan salinan konten halaman yang diperbesar & di-blur
   sebagai latar di luar kartu utama.
   Pengaturan: bagian "EDIT DI SINI" di atas -> const LATAR. */
.bg-echo{display:none}
@media (min-width:640px){
  .bg-echo{
    display:block;position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
    background:var(--frame-color);
  }
  .bg-echo .echo-inner{position:absolute;will-change:transform}
  .bg-echo .echo-blur{
    filter:blur(38px) saturate(1.18) brightness(1.05) contrast(.95);
    display:flex;align-items:flex-start;
  }
  .bg-echo .echo-src{
    flex:none;width:var(--container-w);min-height:0;padding:0;position:static;z-index:auto;
    background:var(--profileBackground);
  }
  .bg-echo .profile{min-height:0;border:0;box-shadow:none}
  .bg-echo *,.bg-echo *::before,.bg-echo *::after{
    animation:none!important;transition:none!important;box-shadow:none!important;
  }
  .bg-echo::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(130% 100% at 50% 38%, transparent 42%, rgba(30,35,16,.14) 100%);
  }
}
@media (orientation:landscape) and (max-height:520px) and (pointer:coarse){
  html{background:var(--profileBackground);background-image:none}
  body::before,body::after{display:none}
  .frame{padding:0}
  .profile{min-height:100dvh;border-radius:0;box-shadow:none;border:0}
  .hero-wrap{height:calc(min(100vw, 60vh) - 80px)}
  .hero{height:min(100vw, 60vh);border-radius:0}
  .no-hero .hero-wrap{height:calc(var(--pad-x) + var(--safe-top) + 56px)}
  .content{padding-inline:var(--safe-left) var(--safe-right)}
}

@media (pointer:coarse){
  .icon-btn{width:44px;height:44px}
  .kebab{width:30px;height:30px}
  .kebab svg{width:22px;height:22px}
  .pcard .kebab{right:8px;bottom:10px}
  .social{width:36px;height:36px}
  .social svg{width:36px;height:36px}
  .tab{font-size:15px}
}
@media (max-width:360px){
  .chin.has-thumb{padding-inline:60px}
  .bio{padding-inline:calc(var(--link-gap) * 2)}
}
@media (hover:none) and (pointer:coarse){
  .link:hover,.pcard:hover,.shop-cta:hover{background:var(--button-style-background)}
  .social:hover{transform:none}
  .kebab:hover{opacity:.5}
  .icon-btn:hover{background:rgba(226,228,222,.6);background:color-mix(in srgb, rgba(255,255,255,.55), #6f7559 12%)}
}
:where(a,button,[tabindex]):focus-visible{outline:3px solid var(--button-style-text);outline-offset:3px;border-radius:8px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media print{
  .topbar,.toast,.player{display:none!important}
  html{background:#fff;background-image:none}
  body::before,body::after{display:none!important}
  .profile{box-shadow:none;border-radius:0;border:0}
  .panel[hidden]{display:block!important}
  .link,.pcard{box-shadow:none;break-inside:avoid}
}

:root{
  --anim-speed:1;
  --t-fast:calc(.22s * var(--anim-speed));
  --t-base:calc(.55s * var(--anim-speed));
  --t-slow:calc(.9s  * var(--anim-speed));
  --ease-out-soft:cubic-bezier(.16,.84,.34,1);
  --ease-pop:cubic-bezier(.34,1.56,.64,1);
}

.scroll-progress{
  position:fixed;top:0;left:0;height:3px;width:100%;z-index:600;contain:strict;will-change:transform;
  transform:scaleX(0);transform-origin:0 50%;
  background:linear-gradient(90deg,var(--button-style-border-color),var(--button-style-background));
  opacity:.9;pointer-events:none;
}

.anim-on.fx-enter .hero{animation:heroIn calc(var(--t-slow) * 1.1) var(--ease-out-soft) both}
@keyframes heroIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}

.anim-on .logo.pop-in,
.anim-on .name-text.pop-in{animation:popIn calc(var(--t-base) * 1.15) var(--ease-pop) both;animation-delay:.12s}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}

.anim-on .fade-up{animation:fadeUp var(--t-base) var(--ease-out-soft) both;animation-delay:var(--d,.24s)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.anim-on .card-reveal.card-reveal{opacity:0;transform:translateY(22px) scale(.985);will-change:opacity,transform;contain:layout}
.anim-on .card-reveal.card-reveal.is-in{
  opacity:1;transform:none;
  transition:opacity var(--t-base) var(--ease-out-soft),transform var(--t-base) var(--ease-out-soft);
  transition-delay:var(--d,0ms);
}
.anim-on .card-reveal.card-reveal.is-in{will-change:auto}

.anim-on.fx-hero .hero img{
  animation:kenBurns calc(22s * var(--anim-speed)) ease-in-out 6 alternate;
  will-change:transform;
}
.anim-on.fx-hero .hero img[data-done]{animation:none;will-change:auto}
@keyframes kenBurns{
  0%  {transform:scale(1) translate3d(0,0,0)}
  100%{transform:scale(1.09) translate3d(0,-1.6%,0)}
}

.anim-on.fx-logo .logo,
.anim-on.fx-logo .name-text{
  animation:popIn calc(var(--t-base) * 1.15) var(--ease-pop) both,
            floaty calc(5.5s * var(--anim-speed)) ease-in-out .8s 20;
}
.anim-on.fx-logo .logo[data-done],
.anim-on.fx-logo .name-text[data-done]{animation:none}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

.anim-on.fx-hover .link,
.anim-on.fx-hover .pcard,
.anim-on.fx-hover .shop-cta{
  transition:background var(--t-fast) var(--ease),
             transform calc(.2s * var(--anim-speed)) var(--ease-pop),
             box-shadow calc(.2s * var(--anim-speed)) var(--ease);
}
@media (hover:hover) and (pointer:fine){
  .anim-on.fx-hover .link:hover,
  .anim-on.fx-hover .pcard:hover,
  .anim-on.fx-hover .shop-cta:hover{
    transform:translate(-2px,-3px);
    box-shadow:6px 8px 0 var(--button-style-shadow-color);
  }
  .anim-on.fx-hover .link:hover .thumb img,
  .anim-on.fx-hover .pcard:hover .pimg img{transform:scale(1.07)}
}
.anim-on.fx-hover .thumb img,
.anim-on.fx-hover .pimg img{transition:transform calc(.45s * var(--anim-speed)) var(--ease-out-soft)}
.anim-on.fx-hover .link:has(.link-hit:active),
.anim-on.fx-hover .pcard:has(.link-hit:active){transform:translate(3px,4px);box-shadow:0 0 0 var(--button-style-shadow-color)}

.anim-on.fx-shine .link,
.anim-on.fx-shine .pcard,
.anim-on.fx-shine .shop-cta,
.anim-on.fx-ripple .link,
.anim-on.fx-ripple .pcard,

    tEls.forEach(function(x){
      var on = x === t;
      x.setAttribute('aria-selected', String(on));
      x.tabIndex = on ? 0 : -1;
      var pn = document.getElementById(x.getAttribute('aria-controls'));
      if (pn) pn.hidden = !on;
    });
    tabsRoot.dataset.active = (t.id === 'tab-shop') ? 'shop' : 'links';
    if (focus) t.focus();
  };
  tEls.forEach(function(t,i){
    t.addEventListener('click', function(){ pick(t,false); });
    t.addEventListener('keydown', function(e){
      var d = {ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];
      if (d){ e.preventDefault(); pick(tEls[(i+d+tEls.length)%tEls.length], true); }
      else if (e.key==='Home'){ e.preventDefault(); pick(tEls[0],true); }
      else if (e.key==='End'){ e.preventDefault(); pick(tEls[tEls.length-1],true); }
    });
  });
}

function legacyCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly','');
  ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
  document.body.appendChild(ta); ta.select();
  try { ta.setSelectionRange(0, text.length); } catch(e){}
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
  document.body.removeChild(ta);
  return ok;
}
function share(url, title){
  var abs; try { abs = new URL(url, location.href).href; } catch(e){ abs = url; }
  var data = { title: title || document.title, url: abs };
  function fb(){ showToast(legacyCopy(abs) ? 'Link tersalin ✓' : 'Tekan ⌘ / Ctrl + C'); }
  if (navigator.share && (!navigator.canShare || navigator.canShare(data))){
    navigator.share(data).catch(function(e){ if (e && e.name !== 'AbortError') fb(); });
  } else if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(abs).then(function(){ showToast('Link tersalin ✓'); }).catch(fb);
  } else fb();
}

(function(){
  var wrap = document.getElementById('player');
  var audio = document.getElementById('playerAudio');
  if (!wrap || !audio) return;
  var btn    = document.getElementById('playerPlay');
  var coverB = document.getElementById('playerCoverB');
  var prev   = document.getElementById('playerPrev');
  var seek   = document.getElementById('playerSeek');
  var cur    = document.getElementById('playerCur');
  var dur    = document.getElementById('playerDur');
  var air    = document.getElementById('playerAir');
  var volW   = document.getElementById('playerVolWrap');
  var volB   = document.getElementById('playerVol');
  var volR   = document.getElementById('playerVolRange');
  var moreB  = document.getElementById('playerMore');
  var menu   = document.getElementById('playerMenu');
  var loopB  = document.getElementById('playerLoop');

  function tampil(m){ if (typeof showToast === 'function') showToast(m); }
  function fmt(s){
    if (!isFinite(s) || s < 0) s = 0;
    s = Math.floor(s);
    return Math.floor(s/60) + ':' + ('0' + (s % 60)).slice(-2);
  }
  function paint(){
    var d = audio.duration, t = audio.currentTime || 0;
    if (cur) cur.textContent = fmt(t);
    if (dur) dur.textContent = '-' + fmt(isFinite(d) ? Math.max(0, d - t) : 0);   /* waktu sisa ala iCloud/Apple */
    var pct = 0;
    if (seek){
      if (isFinite(d) && d > 0) pct = t / d;
      if (!seek._hold) seek.value = String(Math.round(pct * 1000));
      seek.style.setProperty('--p', (pct * 100).toFixed(2) + '%');
    }
  }
  function toggle(){
    if (audio.paused){ var p = audio.play(); if (p && p.catch) p.catch(function(){}); }
    else audio.pause();
  }
  if (btn) btn.addEventListener('click', toggle);
  if (coverB) coverB.addEventListener('click', toggle);
  if (prev) prev.addEventListener('click', function(){ audio.currentTime = 0; paint(); });

  audio.addEventListener('play',  function(){ wrap.classList.add('is-on');  if (btn) btn.setAttribute('aria-label','Jeda'); });
  audio.addEventListener('pause', function(){ wrap.classList.remove('is-on'); if (btn) btn.setAttribute('aria-label','Putar'); });
  audio.addEventListener('ended', function(){
    if (!audio.loop){ audio.currentTime = 0; wrap.classList.remove('is-on'); if (btn) btn.setAttribute('aria-label','Putar'); }
    paint();
  });
  audio.addEventListener('timeupdate', paint);
  audio.addEventListener('loadedmetadata', paint);
  audio.addEventListener('durationchange', paint);

  if (seek){
    seek.addEventListener('pointerdown', function(){ seek._hold = true; });
    window.addEventListener('pointerup', function(){ seek._hold = false; });
    seek.addEventListener('input', function(){
      var d = audio.duration;
      if (!isFinite(d) || d <= 0) return;
      var pct = Number(seek.value) / 1000;
      seek.style.setProperty('--p', (pct * 100).toFixed(2) + '%');
      audio.currentTime = pct * d;
      paint();
    });
  }

  if (air) air.addEventListener('click', function(){
    if (audio.remote && typeof audio.remote.prompt === 'function'){
      audio.remote.prompt().catch(function(e){ if (e && e.name !== 'NotAllowedError') tampil('AirPlay tidak tersedia'); });
    } else if (typeof audio.webkitShowPlaybackTargetPicker === 'function'){
      audio.webkitShowPlaybackTargetPicker();
    } else tampil('AirPlay tidak tersedia di browser ini');
  });

  function paintVol(){
    var v = audio.muted ? 0 : audio.volume;
    if (volR){ volR.value = String(Math.round(v * 100)); volR.style.setProperty('--vp', (v * 100).toFixed(0) + '%'); }
    if (volB){  /* ambang gelombang persis amp-chrome-volume: [.33, .66] */
      var lv = (v <= 0) ? 0 : (v < .33 ? 1 : (v < .66 ? 2 : 3));
      volB.className = 'act lv' + lv;
    }
  }
  if (volR) volR.addEventListener('input', function(){
    var v = Number(volR.value) / 100;
    audio.volume = v; audio.muted = (v === 0);
    paintVol();
  });
  if (volB && volW) volB.addEventListener('click', function(){ volW.classList.toggle('show'); });
  audio.addEventListener('volumechange', paintVol);

  function closeMenu(){ if (menu) menu.classList.remove('open'); if (moreB) moreB.setAttribute('aria-expanded','false'); }
  if (moreB && menu){
    moreB.addEventListener('click', function(e){
      e.stopPropagation();
      var o = menu.classList.toggle('open');
      moreB.setAttribute('aria-expanded', String(o));
    });
    document.addEventListener('pointerdown', function(e){
      if (!menu.contains(e.target) && !moreB.contains(e.target)) closeMenu();
    });
  }
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ closeMenu(); if (volW) volW.classList.remove('show'); }
  });
  if (loopB) loopB.addEventListener('click', function(){
    audio.loop = !audio.loop;
    loopB.classList.toggle('is-active', audio.loop);
    loopB.setAttribute('aria-checked', String(audio.loop));
    closeMenu();
    tampil(audio.loop ? 'Mengulang lagu ini' : 'Ulangan dimatikan');
  });

  /* marquee untuk judul/artis panjang, seperti LCD Apple Music */
  function setupMq(el){
    if (!el || el.classList.contains('is-long')) return;
    if (el.scrollWidth <= el.clientWidth + 1) return;
    var t = el.textContent;
    el.textContent = '';
    var a = document.createElement('span'); a.className = 'mq'; a.textContent = t;
    var b = document.createElement('span'); b.className = 'mq'; b.textContent = t; b.setAttribute('aria-hidden','true');
    el.appendChild(a); el.appendChild(b);
    el.classList.add('is-long');
    var w = a.offsetWidth;
    el.style.setProperty('--mq', (-w) + 'px');
    el.style.setProperty('--mqd', Math.max(7, Math.min(26, w / 22)).toFixed(2) + 's');
  }
  function mqRun(){
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    setupMq(document.getElementById('playerTitle'));
    setupMq(document.getElementById('playerArtist'));
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(mqRun); else mqRun();

  paint();
  paintVol();
})();
})();
</script>

<script>

(function(){
'use strict';

var A = (typeof ANIMASI !== 'undefined' && ANIMASI) ? ANIMASI : {};
function on(k, def){ return A[k] === undefined ? (def !== false) : A[k] === true; }

var root = document.documentElement;
var hemat = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var AKTIF = (A.aktif !== false) && !hemat;

if (!AKTIF){

  root.classList.remove('anim-on');
  return;
}

var spd = parseFloat(A.kecepatan);
if (!isFinite(spd) || spd <= 0) spd = 1;
spd = Math.min(3, Math.max(.3, spd));
root.style.setProperty('--anim-speed', spd);

function perluModeHemat(){
  var m = String(A.modeHemat === undefined ? 'auto' : A.modeHemat).toLowerCase();
  if (m === 'selalu' || m === 'always' || m === 'true') return true;
  if (m === 'jangan' || m === 'never'  || m === 'false') return false;

  var n = navigator || {};

  var c = n.connection || n.mozConnection || n.webkitConnection;
  if (c){
    if (c.saveData === true) return true;
    if (/^(slow-2g|2g|3g)$/.test(String(c.effectiveType || ''))) return true;
  }

  if (typeof n.deviceMemory === 'number' && n.deviceMemory <= 4) return true;
  if (typeof n.hardwareConcurrency === 'number' && n.hardwareConcurrency <= 4) return true;
  return false;
}
var LITE = perluModeHemat();

root.classList.add('anim-on');
if (LITE) root.classList.add('anim-lite');
if (on('masukHalaman'))       root.classList.add('fx-enter');
if (on('fotoBernapas'))       root.classList.add('fx-hero');
if (on('logoMengambang'))     root.classList.add('fx-logo');
if (on('hoverTombol'))        root.classList.add('fx-hover');
if (on('kilauTombol') && !LITE) root.classList.add('fx-shine');
if (on('efekSentuh'))         root.classList.add('fx-ripple');
if (on('ikonSosialMemantul')) root.classList.add('fx-social');
if (on('lencanaBerkilau'))    root.classList.add('fx-badge');

var profile = document.querySelector('.profile');
if (!profile) return;

if (on('garisProgres') && !LITE){
  var bar = document.createElement('div');
  bar.className = 'scroll-progress';
  bar.setAttribute('aria-hidden','true');
  document.body.appendChild(bar);
  var ticking = false;
  var update = function(){
    var h = document.documentElement.scrollHeight - window.innerHeight;
    var p = h > 0 ? Math.min(1, Math.max(0, window.scrollY / h)) : 0;
    bar.style.transform = 'scaleX(' + p + ')';
    ticking = false;
  };
  window.addEventListener('scroll', function(){
    if (!ticking){ ticking = true; requestAnimationFrame(update); }
  }, {passive:true});
  window.addEventListener('resize', update, {passive:true});
  update();
}

var step = parseInt(A.jedaAntarTombol, 10);
if (!isFinite(step)) step = 80;
step = Math.min(400, Math.max(0, step));

if (on('masukHalaman')){
  var logo = document.querySelector('.logo') || document.querySelector('.name-text');
  if (logo) logo.classList.add('pop-in');
  ['.bio', '.verified', '.tabs', '.socials', '.player'].forEach(function(sel, k){
    var el = document.querySelector(sel);
    if (!el) return;
    el.classList.add('fade-up');
    el.style.setProperty('--d', (220 + k * 70) + 'ms');
  });
}

document.querySelectorAll('.socials .social').forEach(function(el, i){
  el.style.setProperty('--d', (i * 140) + 'ms');
});

var cards = [].slice.call(document.querySelectorAll('.link, .pcard, .shop-cta'));

if (on('munculSaatScroll') && cards.length && 'IntersectionObserver' in window){
  cards.forEach(function(c){ c.classList.add('card-reveal'); });

  var seen = 0;
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (!en.isIntersecting) return;
      var el = en.target;
      var d = (seen % 6) * step;
      el.style.setProperty('--d', d + 'ms');

<script>
/* ===== ECHO BLUR BACKGROUND (hanya desktop) =====
   Menyalin tampilan halaman ke lapisan latar yang diperbesar
   lalu di-blur, jadi area di luar web utama di desktop tidak
   lagi kosong/hanya warna.
   - Pengaturan : const LATAR di bagian "EDIT DI SINI" di atas.
   - Ukuran & posisi otomatis menyesuaikan layar (resize/zoom).
   - Aktif hanya di min-width:640px, nonaktif di ponsel landscape & print. */
(function(){
'use strict';
var mq = window.matchMedia ? window.matchMedia('(min-width:640px)') : null;
var lq = window.matchMedia ? window.matchMedia('(orientation:landscape) and (max-height:520px) and (pointer:coarse)') : null;

var LB = (typeof LATAR !== 'undefined' && LATAR) ? LATAR : {};
if (LB.aktif === false) return;
var targetBlur = Math.min(150, Math.max(10, parseFloat(LB.blur) || 90));

var app = document.getElementById('app');
var frame = app ? app.querySelector('.frame') : null;
if (!app || !app.parentNode || !frame) return;

var shell, inner, blurBox, clone;

function build(){
  clone = frame.cloneNode(true);
  clone.removeAttribute('id');
  clone.classList.add('echo-src');
  clone.querySelectorAll('[id]').forEach(function(el){ el.removeAttribute('id'); });
  clone.querySelectorAll('audio, script, noscript, iframe, form').forEach(function(el){ el.remove(); });
  shell = document.createElement('div');
  shell.className = 'bg-echo';
  shell.setAttribute('aria-hidden','true');
  inner = document.createElement('div');
  inner.className = 'echo-inner';
  blurBox = document.createElement('div');
  blurBox.className = 'echo-blur';
  blurBox.appendChild(clone);
  inner.appendChild(blurBox);
  shell.appendChild(inner);
  app.parentNode.insertBefore(shell, app);
  fit();
}

function setTiles(n){
  var cur = blurBox.children.length;
  if (n === cur) return;
  if (n < cur){
    while (blurBox.children.length > n) blurBox.removeChild(blurBox.lastChild);
  } else {
    var tpl = blurBox.children[0];
    while (blurBox.children.length < n) blurBox.appendChild(tpl.cloneNode(true));
  }
}

function fit(){
  if (!shell || !clone) return;
  if (!mq || !mq.matches || (lq && lq.matches)){ shell.style.display = 'none'; return; }
  shell.style.display = '';
  var W = clone.offsetWidth || 580;
  var H = clone.offsetHeight || 900;
  var vw = window.innerWidth, vh = window.innerHeight;
  var s, tiles = 1, topAlign = true;

  if (H >= vh){
    // Konten lebih tinggi dari layar: perbesar sampai layar tertutup dan
    // rataan ATAS, supaya foto di atas ikut terlihat di bagian atas layar.
    s = Math.max(vw / W, vh / H) * 1.05;
    s = Math.min(s, 8);
  } else {
    // Konten lebih pendek dari layar: muatkan tinggi layar lalu ulangi
    // ke samping sampai layar tertutup (sambungan tertutupi blur).
    s = Math.min((vh / H) * 1.05, 6);
    tiles = Math.max(1, Math.ceil(vw / Math.max(1, W * s)) + 1);
    topAlign = false;
  }
  setTiles(tiles);
  if (topAlign){
    inner.style.cssText = 'position:absolute;left:50%;top:0;transform-origin:top center;transform:translateX(-50%) scale(' + s.toFixed(3) + ')';
  } else {
    inner.style.cssText = 'position:absolute;left:50%;top:50%;transform-origin:center;transform:translate(-50%,-50%) scale(' + s.toFixed(3) + ')';
  }
  var b = Math.min(200, Math.max(6, targetBlur / s));
  blurBox.style.filter = 'blur(' + b.toFixed(1) + 'px) saturate(1.18) brightness(1.05) contrast(.95)';
}

var rt;
function queueFit(){ clearTimeout(rt); rt = setTimeout(fit, 180); }

window.addEventListener('resize', queueFit, {passive:true});
window.addEventListener('orientationchange', queueFit, {passive:true});
window.addEventListener('load', queueFit);

if ('MutationObserver' in window){
  var profile = document.querySelector('.profile');
  if (profile){
    new MutationObserver(queueFit).observe(profile, {
      childList:true, subtree:true, attributes:true, attributeFilter:['hidden','class']
    });
  }
}
if (mq && mq.addEventListener) mq.addEventListener('change', fit);

build();
})();
